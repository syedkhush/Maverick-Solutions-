<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Maverick Solutions • digital ecosystem</title>
  <!-- modern fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 10% 25%, #0a2f28, #041c17);
      background-attachment: fixed;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: #f3f9f3;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    /* subtle noise texture (organic refinement) */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.045'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    .master-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.8rem 2.5rem 4rem;
      position: relative;
      z-index: 2;
    }

    /* Navigation */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(210, 230, 210, 0.15);
    }

    .logo-brand {
      font-family: 'Space Grotesk', monospace;
      font-weight: 700;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
      background: linear-gradient(130deg, #FFFFFF, #c0e0cf);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .logo-brand span {
      background: none;
      color: #E6B87E;
      -webkit-background-clip: unset;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }
    .nav-links a {
      color: #e0f2e8;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      transition: 0.2s;
      border-bottom: 1px solid transparent;
      padding-bottom: 3px;
    }
    .nav-links a:hover {
      color: #E6B87E;
      border-bottom-color: #E6B87E;
    }

    /* hero grid */
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
      margin: 3rem 0 4rem;
    }

    .hero-left {
      animation: fadeUp 0.7s ease-out forwards;
    }
    .badge {
      display: inline-block;
      background: rgba(230, 184, 126, 0.18);
      backdrop-filter: blur(5px);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #FFE2B5;
      border: 0.5px solid rgba(230, 184, 126, 0.5);
      margin-bottom: 1.5rem;
    }
    .hero-left h1 {
      font-size: clamp(2.8rem, 6vw, 5rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #FEF9E6, #CBEBD9);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 1.5rem;
    }
    .hero-desc {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cfeadb;
      max-width: 480px;
      margin-bottom: 2rem;
      font-weight: 350;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .btn-primary {
      background: #E6B87E;
      border: none;
      padding: 0.8rem 2rem;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 44px;
      color: #0a2f28;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      display: inline-block;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
    }
    .btn-primary:hover {
      background: #ffce9a;
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.2);
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #b8d9cb;
      padding: 0.8rem 2rem;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 44px;
      color: #ebf7f0;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
    }
    .btn-outline:hover {
      background: rgba(230, 184, 126, 0.12);
      border-color: #E6B87E;
      color: white;
    }

    /* SVG gecko area */
    .gecko-art {
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.4));
    }
    svg {
      width: 100%;
      max-width: 560px;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25));
    }

    /* stats ribbon */
    .stats-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin: 3rem 0 3rem;
      padding: 1.8rem 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .stat-card {
      text-align: center;
      flex: 1;
    }
    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: #E6B87E;
      font-family: 'Space Grotesk', monospace;
    }
    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 400;
      color: #b8d3c5;
    }

    /* services preview */
    .services-section {
      margin: 4rem 0;
    }
    .section-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 0.5rem;
    }
    .section-sub {
      color: #cbebdd;
      font-weight: 350;
      margin-bottom: 2rem;
      max-width: 550px;
    }
    .service-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .serv-card {
      background: rgba(20, 55, 45, 0.55);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      padding: 1.5rem 1.2rem;
      flex: 1;
      min-width: 180px;
      transition: 0.2s;
      border: 1px solid rgba(230, 184, 126, 0.2);
    }
    .serv-card:hover {
      transform: translateY(-4px);
      background: rgba(33, 72, 60, 0.7);
      border-color: #E6B87E;
    }
    .serv-icon {
      font-size: 2rem;
      margin-bottom: 0.8rem;
    }
    .serv-card h4 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    .serv-card p {
      font-size: 0.8rem;
      color: #c5e2d4;
    }

    /* contact CTA */
    .contact-cta {
      background: linear-gradient(115deg, #0f3d33 0%, #06221c 100%);
      border-radius: 2rem;
      padding: 2rem 2.5rem;
      margin: 3rem 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      border: 1px solid rgba(230, 184, 126, 0.3);
    }
    .contact-cta h3 {
      font-size: 1.5rem;
      font-weight: 600;
    }
    .contact-cta p {
      color: #cfe6dc;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.75rem;
      color: #98bba9;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 2rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px);}
      to { opacity: 1; transform: translateY(0);}
    }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 780px) {
      .master-container { padding: 1.2rem 1.5rem 2.5rem; }
      .hero-grid { grid-template-columns: 1fr; text-align: center; gap: 2rem; }
      .hero-desc { margin-left: auto; margin-right: auto; }
      .btn-group { justify-content: center; }
      .stats-row { flex-direction: column; align-items: center; }
      .contact-cta { flex-direction: column; text-align: center; }
      footer { flex-direction: column; align-items: center; }
      .nav-links { gap: 1.2rem; }
    }
  </style>
</head>
